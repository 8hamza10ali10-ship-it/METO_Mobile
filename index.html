<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="METO - Your Personal AI Assistant">
  <title>METO AI</title>

  <style>
    :root {
      --bg: #090909;
      --panel: #141414;
      --panel2: #1d1d1d;
      --red: #d92f40;
      --red2: #a91f2e;
      --text: #f5f5f5;
      --muted: #929292;
      --border: #292929;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 72px;
      flex-shrink: 0;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      font-size: 27px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--red);
    }

    .subtitle {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 1px;
    }

    .status {
      font-size: 11px;
      color: #45c982;
      direction: ltr;
    }

    .new-chat {
      border: 1px solid var(--border);
      background: var(--panel2);
      color: white;
      border-radius: 9px;
      padding: 9px 12px;
      cursor: pointer;
    }

    #chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 22px 15px;
      display: flex;
      flex-direction: column;
      gap: 17px;
      scroll-behavior: smooth;
    }

    .welcome {
      margin: auto;
      text-align: center;
      color: var(--muted);
      line-height: 2;
    }

    .welcome-logo {
      font-size: 48px;
      font-weight: 900;
      color: var(--red);
      letter-spacing: 4px;
    }

    .message {
      max-width: 88%;
      padding: 13px 16px;
      border-radius: 15px;
      font-size: 15px;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .bot {
      align-self: flex-start;
      background: var(--panel2);
      border: 1px solid var(--border);
      border-top-right-radius: 4px;
    }

    .user {
      align-self: flex-end;
      background: var(--red2);
      border-top-left-radius: 4px;
    }

    .sender {
      display: block;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 5px;
      opacity: .8;
    }

    .typing {
      color: var(--muted);
      font-size: 13px;
      padding: 8px 15px;
    }

    footer {
      flex-shrink: 0;
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 12px;
    }

    .input-area {
      display: flex;
      gap: 9px;
      max-width: 900px;
      margin: auto;
    }

    #message {
      flex: 1;
      min-width: 0;
      height: 50px;
      border: 1px solid #393939;
      background: #222;
      color: white;
      border-radius: 12px;
      padding: 0 15px;
      font-size: 15px;
      outline: none;
    }

    #message:focus {
      border-color: var(--red);
    }

    #send {
      width: 76px;
      border: none;
      border-radius: 12px;
      background: var(--red);
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    #send:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .footer-note {
      text-align: center;
      color: #666;
      font-size: 10px;
      margin-top: 9px;
    }

    @media (min-width: 700px) {
      #chat {
        padding: 25px max(25px, calc((100% - 850px) / 2));
      }

      .message {
        max-width: 70%;
      }

      footer {
        padding: 15px 25px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <div>
        <div class="logo">METO</div>
        <div class="subtitle">PERSONAL AI ASSISTANT</div>
      </div>
      <div class="status" id="status">● ONLINE</div>
    </div>

    <button class="new-chat" id="newChat" type="button">
      محادثة جديدة
    </button>
  </header>

  <main id="chat">
    <div class="welcome" id="welcome">
      <div class="welcome-logo">METO</div>
      <div>أهلاً بيك! أنا METO.</div>
      <div>جاهز أساعدك في أي وقت.</div>
    </div>
  </main>

  <footer>
    <div class="input-area">
      <input
        id="message"
        type="text"
        placeholder="اكتب رسالتك إلى METO..."
        autocomplete="off"
      >

      <button id="send" type="button">إرسال</button>
    </div>

    <div class="footer-note">
      METO AI · Powered by Groq
    </div>
  </footer>

  <script>
    const API_URL =
      "https://meto-api.8hamza10ali10.workers.dev/";

    const chat = document.getElementById("chat");
    const input = document.getElementById("message");
    const sendButton = document.getElementById("send");
    const status = document.getElementById("status");
    const newChatButton = document.getElementById("newChat");

    let waiting = false;

    function addMessage(sender, text) {
      const box = document.createElement("div");
      box.classList.add("message");

      if (sender === "METO") {
        box.classList.add("bot");
      } else {
        box.classList.add("user");
      }

      const name = document.createElement("span");
      name.className = "sender";
      name.textContent = sender;

      const content = document.createElement("div");
      content.textContent = text;

      box.appendChild(name);
      box.appendChild(content);
      chat.appendChild(box);

      chat.scrollTop = chat.scrollHeight;
    }

    function setStatus(text, color) {
      status.textContent = "● " + text;
      status.style.color = color;
    }

    async function sendMessage() {
      const text = input.value.trim();

      if (!text || waiting) return;

      waiting = true;
      sendButton.disabled = true;
      input.disabled = true;

      const welcome = document.getElementById("welcome");
      if (welcome) welcome.remove();

      addMessage("أنت", text);
      input.value = "";

      const typing = document.createElement("div");
      typing.className = "typing";
      typing.textContent = "METO بيفكر...";
      chat.appendChild(typing);

      setStatus("THINKING", "#e5a13b");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: text
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "الخادم رفض الطلب"
          );
        }

        if (!data.reply) {
          throw new Error("الخادم لم يرجع ردًا صالحًا");
        }

        addMessage("METO", data.reply);

      } catch (error) {
        addMessage(
          "حصلت مشكلة في الاتصال:\n" + error.message
        );

        setStatus("ERROR", "#ff5555");

      } finally {
        typing.remove();
        waiting = false;
        sendButton.disabled = false;
        input.disabled = false;
        input.focus();

        if (status.textContent.includes("ERROR")) {
          return;
        }

        setStatus("ONLINE", "#45c982");
      }
    }

    function clearChat() {
      if (waiting) return;

      chat.innerHTML = 
        <div class="welcome" id="welcome">
          <div class="welcome-logo">METO</div>
          <div>أهلاً بيك! أنا METO.</div>
          <div>جاهز أساعدك في أي وقت.</div>
        </div>
      ;
    }

    sendButton.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    newChatButton.addEventListener("click", clearChat);
  </script>

</body>
</html>
