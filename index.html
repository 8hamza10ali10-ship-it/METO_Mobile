<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0b0b">
  <title>METO AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0b;
      color: white;
      font-family: Arial, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #151515;
      padding: 18px;
      border-bottom: 1px solid #292929;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: #e53945;
      font-size: 26px;
      font-weight: bold;
    }

    .status {
      color: #42c77a;
      font-size: 12px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      max-width: 85%;
      padding: 13px 16px;
      border-radius: 15px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .bot {
      background: #1b1b1b;
      border: 1px solid #333;
      align-self: flex-start;
    }

    .user {
      background: #8f202b;
      align-self: flex-end;
    }

    footer {
      padding: 12px;
      background: #151515;
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      min-width: 0;
      background: #242424;
      border: 1px solid #444;
      border-radius: 12px;
      padding: 14px;
      color: white;
      outline: none;
      font-size: 15px;
    }

    button {
      background: #c62835;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      font-size: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">METO</div>
    <div class="status">● ONLINE</div>
  </header>

  <main id="chat">
    <div class="message bot">
      أهلاً بيك! أنا METO، جاهز أساعدك.
    </div>
  </main>

  <footer>
    <input id="message" placeholder="اكتب رسالتك إلى METO...">
    <button onclick="sendMessage()">إرسال</button>
  </footer>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("message");

    function addMessage(text, type) {
      const message = document.createElement("div");
      message.className = "message " + type;
      message.textContent = text;
      chat.appendChild(message);
      chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {
      const text = input.value.trim();

      if (!text) return;

      addMessage(text, "user");
      input.value = "";

      addMessage(
        "أنا جاهز! لسه بنوصل عقل METO السحابي.",
        "bot"
      );
    }

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
